# manifests/mlflow/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: mlflow
        image: docker.io/lian1280/mlflow:v3.10.1
        command: ["mlflow", "server"]
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "5000"
          - "--workers"
          - "1"
          - "--backend-store-uri"
          - "postgresql://mlflow_user@172.31.2.221:5432/mlflow_db"
          - "--default-artifact-root"
          - "s3://ceramicraft-mlflow/"
          - "--allowed-hosts"
          - "*"
        ports:
        - containerPort: 5000
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: mlflow-secrets
                key: MLFLOW_DB_PASSWORD
          - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
            value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /
            port: 5000
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 5