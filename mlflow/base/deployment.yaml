apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: mlflow
          image: docker.io/lian1280/mlflow:v3.10.1
          command: ["mlflow", "server"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5000"
            - "--workers"
            - "1"
            - "--backend-store-uri"
            - "postgresql://mlflow_user@172.31.2.221:5432/mlflow_db"
            - "--default-artifact-root"
            - "s3://ceramicraft-mlflow/"
            - "--allowed-origins"
            - "https://mlflow.ntdoc.site"
            - "--allowed-hosts"
            - "mlflow.ntdoc.site"
          ports:
            - containerPort: 5000
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: MLFLOW_DB_PASSWORD

            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "300"

            # 保留 tracing / prompt，但关闭最可疑的后台 job execution
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"

            # 保留 async trace，但把并发压到最低
            - name: MLFLOW_ENABLE_ASYNC_TRACE_LOGGING
              value: "true"
            - name: MLFLOW_ASYNC_TRACE_LOGGING_MAX_WORKERS
              value: "1"
            - name: MLFLOW_ASYNC_TRACE_LOGGING_MAX_QUEUE_SIZE
              value: "100"
            - name: MLFLOW_ASYNC_TRACE_LOGGING_MAX_SPAN_BATCH_SIZE
              value: "1"
            - name: MLFLOW_ASYNC_TRACE_LOGGING_RETRY_TIMEOUT
              value: "60"

            # 普通异步日志线程池压小
            - name: MLFLOW_ENABLE_ASYNC_LOGGING
              value: "true"
            - name: MLFLOW_ASYNC_LOGGING_THREADPOOL_SIZE
              value: "1"
            - name: MLFLOW_ASYNC_LOGGING_BUFFERING_SECONDS
              value: "5"

            # 收紧 SQLAlchemy 连接池
            - name: MLFLOW_SQLALCHEMYSTORE_POOL_SIZE
              value: "1"
            - name: MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW
              value: "0"
            - name: MLFLOW_SQLALCHEMYSTORE_POOL_RECYCLE
              value: "1800"

            # 可选：先关 telemetry，少一点后台动作
            - name: MLFLOW_DISABLE_TELEMETRY
              value: "true"

            - name: MLFLOW_CORS_ALLOW_ORIGINS
              value: "https://mlflow.ntdoc.site"

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3