apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sw5005-sus/ceramicraft-argocd-deploy.git
    targetRevision: HEAD
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 26.0.0
    helm:
      values: |
        deployment:
          strategy:
            type: Recreate
        service: 
          type: ClusterIP
        ports:
          web:
            exposedPort: 80
            hostPort: 80
          websecure:
            exposedPort: 443
            hostPort: 443
        additionalArguments:
          - "--providers.kubernetesCRD.allowCrossNamespace=true"
        rbac:
          namespaced: false
        experimental:
          plugins:
            coraza:
              moduleName: "github.com/corazawaf/coraza-traefik"
              version: "v0.3.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

