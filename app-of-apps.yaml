---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.7.0
    helm:
      values: |
        rbac:
          create: true
          clusterRules:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["nodes/proxy"]
              verbs: ["get"]
        alloy:
          configMap:
            create: true
            content: |
              prometheus.remote_write "metrics_service" {
                endpoint {
                  url = "https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push"
                  basic_auth {
                    username = env("PROM_USER")
                    password = env("PROM_API_KEY")
                  }
                }
              }

              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "kubelet" {
                targets = discovery.kubernetes.nodes.targets

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "__metrics_path__"
                  replacement   = "/api/v1/nodes/$1/proxy/metrics"
                }

                rule {
                  target_label = "__address__"
                  replacement  = "kubernetes.default.svc:443"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "instance"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "node"
                }
              }

              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "__metrics_path__"
                  replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
                }

                rule {
                  target_label = "__address__"
                  replacement  = "kubernetes.default.svc:443"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "instance"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "node"
                }
              }

              prometheus.scrape "kubernetes_nodes" {
                targets = discovery.relabel.kubelet.output
                scheme  = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = false
                  ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  server_name          = "kubernetes"
                }
                forward_to = [prometheus.remote_write.metrics_service.receiver]
              }

              prometheus.scrape "kubernetes_cadvisor" {
                targets = discovery.relabel.cadvisor.output
                scheme  = "https"

                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                tls_config {
                  ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  insecure_skip_verify = false
                  server_name          = "kubernetes"
                }

                forward_to = [prometheus.remote_write.metrics_service.receiver]
              }

              prometheus.scrape "kube_state_metrics" {
                targets = [
                  {
                    __address__ = "ksm-kube-state-metrics.monitoring.svc:8080",
                    job         = "kube-state-metrics",
                  },
                ]
                forward_to = [prometheus.remote_write.metrics_service.receiver]
              }

              loki.write "grafana_cloud_loki" {
                endpoint {
                  url = "https://logs-prod-020.grafana.net/loki/api/v1/push"
                  basic_auth {
                    username = env("LOKI_USER")
                    password = env("LOKI_API_KEY")
                  }
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.grafana_cloud_loki.receiver]
              }

              otelcol.auth.basic "grafana_cloud_tempo" {
                username = env("TEMPO_USER")
                password = env("TEMPO_API_KEY")
              }

              otelcol.exporter.otlp "grafana_cloud_tempo" {
                client {
                  endpoint = "tempo-prod-14-prod-ap-southeast-1.grafana.net:443"
                  auth     = otelcol.auth.basic.grafana_cloud_tempo.handler
                }
              }

              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces  = [otelcol.exporter.otlp.grafana_cloud_tempo.input]
                  metrics = [otelcol.exporter.prometheus.grafana_cloud.input]
                }
              }

              otelcol.exporter.prometheus "grafana_cloud" {
                forward_to = [prometheus.remote_write.metrics_service.receiver]
              }

          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP

          extraEnv:
            - name: LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: loki-user
            - name: LOKI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: loki-api-key
            - name: TEMPO_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: tempo-user
            - name: TEMPO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: tempo-api-key
            - name: PROM_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: prom-user
            - name: PROM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: prom-api-key

        service:
          enabled: true
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true