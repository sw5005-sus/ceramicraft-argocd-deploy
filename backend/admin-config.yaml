apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-ms-config
data:
  config.yml: |
    grpc:
      host: "0.0.0.0"
      port: 5001
      connect_timeout: 3
      max_pool_size: 200

    http:
      host: "0.0.0.0"
      port: 8080

    log:
      level: debug
      file_path: ./logs/ceramicraft-admin-mservice.log

    mysql:
      host: "middleware-internal-svc.default.svc.cluster.local"
      port: "3306"
      userName: "ceramicraft"
      dbName: "admin_db"
    
    audit_grpc:
      host: "log-ms-svc.default.svc.cluster.local"
      port: 50051
    
    redis:
      host: "middleware-internal-svc.default.svc.cluster.local"
      port: 6379