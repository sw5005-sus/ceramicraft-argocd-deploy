apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: review-agent-external-secret
  namespace: default
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: review-agent-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/ceramicraft/review_agent_config
    - extract:
        key: secret/ceramicraft