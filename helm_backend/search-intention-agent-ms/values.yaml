replicaCount: 1

image:
  repository: lian1280/ceramicraft-search-intention-agent
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8070
  grpcPort: 50051

livenessProbe:
  path: /actuator/health
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  path: /actuator/health
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

volumes:
  configMapName: search-intention-agent-ms-config
  logPath: /tmp/logs/search-intention-agent

externalSecret:
  targetName: search-intention-agent-secrets

extraEnv:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: REDIS_HOST
    value: "middleware-internal-svc.default.svc.cluster.local"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_VECTOR_URL
    value: "redis://middleware-internal-svc.default.svc.cluster.local:6379"
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "middleware-internal-svc.default.svc.cluster.local:29092"
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.mlflow.svc.cluster.local"
  - name: MLFLOW_EXPERIMENT_NAME
    value: "ceramicraft-search-agent"
  - name: PRODUCT_API_BASE_URL
    value: "http://product-ms-svc:8080"
  - name: CERAMIC_KAFKA_TOPIC_SEARCH
    value: "product_changed"
  - name: OTEL_SERVICE_NAME
    value: "search-intention-agent-ms"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "deployment.environment=production,k3s.cluster=main"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://grafana-alloy.monitoring.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_EXPORTER_OTLP_INSECURE
    value: "true"
  - name: OTEL_TRACES_EXPORTER
    value: "otlp"
  - name: OTEL_METRICS_EXPORTER
    value: "otlp"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
