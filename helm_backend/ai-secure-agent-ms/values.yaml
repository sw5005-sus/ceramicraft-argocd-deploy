replicaCount: 1

image:
  repository: lian1280/ceramicraft-ai-secure-agent
  tag: debug-202604111328
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  grpcPort: 5001

livenessProbe:
  path: /ai-secure-agent-ms/v1/ping
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
readinessProbe:
  path: /ai-secure-agent-ms/v1/ping
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 128Mi

volumes:
  configMapName: ai-secure-agent-ms-config
  logPath: /tmp/logs/ai-secure-agent
  mountPath: /app/resources/config.yml
  subPath: config.yml

externalSecret:
  targetName: ai-secure-agent-secrets

extraEnv:
  - name: CONFIG_PATH
    value: /app/resources/config.yml
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: ENABLE_MLFLOW_TRACING
    value: "false"
  - name: MLFLOW_TRACKING_URI
    value: http://mlflow.mlflow.svc.cluster.local
  - name: MALLOC_ARENA_MAX
    value: "2"
  # otel config
  - name: OTEL_SERVICE_NAME
    value: "ai-secure-agent-ms"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "deployment.environment=production,k3s.cluster=main"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT # duplicate with common env import from Vault, keep it here for better visibility
    value: "grafana-alloy.monitoring.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_EXPORTER_OTLP_INSECURE
    value: "true"
  - name: OTEL_TRACES_EXPORTER
    value: "otlp"
  - name: OTEL_METRICS_EXPORTER
    value: "otlp"
  - name: OTEL_LOGS_EXPORTER
    value: "otlp"
  - name: OTEL_PYTHON_LOG_CORRELATION
    value: "true"