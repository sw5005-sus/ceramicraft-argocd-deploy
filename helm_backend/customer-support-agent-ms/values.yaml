replicaCount: 1

image:
  repository: lian1280/ceramicraft-customer-support-agent
  tag: dev-202604150801
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051

livenessProbe:
  path: /cs-agent/v1/ping
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  path: /cs-agent/v1/ping
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

volumes:
  configMapName: customer-support-agent-ms-config
  logPath: /tmp/logs/customer-support-agent

externalSecret:
  targetName: customer-support-agent-secrets

extraEnv:
  - name: CS_AGENT_MCP_SERVER_URL
    value: "http://mcp-server-svc:8080/mcp"
  - name: CS_AGENT_OPENAI_MODEL
    value: "gpt-4o"
  - name: CS_AGENT_DB_NAME
    value: "cs_agent_db"
  - name: CS_AGENT_MLFLOW_EXPERIMENT_NAME
    value: "customer-support-agent"
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.mlflow.svc.cluster.local"
  - name: PYTHONUNBUFFERED
    value: "1"
  # Override Linkerd-injected OTEL env to prevent MLflow from using OTLP exporter
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: ""
