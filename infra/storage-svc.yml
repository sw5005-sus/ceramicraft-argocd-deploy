apiVersion: v1
kind: Service
metadata:
  name: middleware-internal-svc
  namespace: default
spec:
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
    - name: postgres
      protocol: TCP
      port: 5432
    - name: kafka
      protocol: TCP
      port: 29092
    - name: redis
      protocol: TCP
      port: 6379
    - name: mongo
      protocol: TCP
      port: 27017

---
apiVersion: v1
kind: Endpoints
metadata:
  name: middleware-internal-svc
  namespace: default
subsets:
  - addresses:
      - ip: 100.76.127.66
    ports:
      - name: mysql
        port: 3306
      - name: postgres
        port: 5432
      - name: kafka
        port: 29092
      - name: redis
        port: 6379
      - name: mongo
        port: 27017