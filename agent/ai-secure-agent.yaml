apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-secure-agent-ms
  namespace: default
  labels:
    app: ai-secure-agent-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-secure-agent-ms
  template:
    metadata:
      labels:
        app: ai-secure-agent-ms
    spec:
      containers:
        - name: ai-secure-agent-ms
          image: lian1280/ceramicraft-ai-secure-agent:debug-202604071410
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /app/resources/config.yml
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ENABLE_MLFLOW_TRACING
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-tracking-svc.mlflow.svc.cluster.local:5000
            - name: MALLOC_ARENA_MAX
              value: "2"
          volumeMounts:
            - name: config
              mountPath: /app/resources/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ai-secure-agent-ms-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-secure-agent-ms-svc
  namespace: default
  labels:
    app: ai-secure-agent-ms
spec:
  type: ClusterIP
  selector:
    app: ai-secure-agent-ms
  ports:
    - name: http
      port: 8080
      targetPort: 8080